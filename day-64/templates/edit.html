{% extends 'base.html' %}
{% block title %}Edit Game{% endblock %} {% block content %}
<div class="content">
  <h1 class="heading">Game Title</h1>
  <p class="description">Edit Game Rating</p>

  <form method="POST">
    <input type="hidden" name="id" value="{{ game.id }}">
    <label>Rating</label>
    <input type="text" name="rating" value="{{ game.rating }}"><br>
    <label>Review</label>
    <input type="text" name="review" value="{{ game.review }}"><br>
    <button type="submit">Done</button>
  </form>
</div>
{% endblock %}
